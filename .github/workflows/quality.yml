name: quality

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: |
          python -m compileall aws-dashboard/backend gateway/lilygo-micropython
      - name: Reject committed secrets
        shell: bash
        run: |
          ! grep -RInE --exclude-dir=.git --exclude='*.md' \
            '(BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|aws_secret_access_key|private\.pem\.key")' .
